<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="base.css">
    <title>Sign In - UN AMS Study Hub</title>
    <script defer src="./sesion.js"></script>
    <script defer src="./login.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar">
            <div class="container">
                <span class="navbar-brand d-flex align-items-center gap-3">
                    <div class="bg-primary text-white fw-bold rounded-circle d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        UN
                    </div>
                    <div class="brand-info">
                        <h1>UN AMS Preparation</h1>
    
                    </div>
                </span>
            </div>
        </nav>
    </header>

    <main class="container d-flex align-items-center justify-content-center py-5">
        <div class="card card-un shadow-sm w-100" style="max-width: 420px;">
            <div class="card-body p-4">
                <span class="badge rounded-pill text-bg-primary mb-2">RESTRICTED ACCESS</span>
                <h2 class="fs-3 fw-bold mb-1">Sign In</h2>
                

                <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert">
                    Invalid username or password. Please try again.
                </div>

                <form id="form-login" class="d-flex flex-column gap-3">
                    <div>
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                    </div>

                    <div>
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-un w-100 fw-semibold py-2 mt-2">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-brand">
            <span>UN AMS Study Hub</span>
            <p class="small mb-0">Personal preparation platform for UN Peacekeeping Assessments.</p>
        </div>
    </footer>
</body>

</html>
